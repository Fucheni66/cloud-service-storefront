# ============================================================
# 生产环境数据库配置（部署后覆盖 ROOT/WEB-INF/classes/db.properties）
# 改完三项：端口、用户名、密码，然后重启 Tomcat
# ============================================================
jdbc.driver=com.mysql.cj.jdbc.Driver
# 宝塔 MySQL 默认端口 3306；库名 ajou_admin 必须与导入 install.sql 时一致
jdbc.url=jdbc:mysql://127.0.0.1:3306/ajou_admin?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=Asia/Shanghai&characterEncoding=UTF-8
# 在宝塔「数据库」里为 ajou_admin 库创建的账号（建议不要用 root）
jdbc.username=ajou_admin
jdbc.password=在此填写宝塔数据库密码
