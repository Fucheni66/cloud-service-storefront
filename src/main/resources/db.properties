# MySQL 连接配置（本地开发：MAMP 默认 MySQL 端口 8889）
# 用 127.0.0.1 而非 localhost，避免 macOS 上走 socket 解析
# 部署时请改为真实的数据库账号与密码，切勿把真实密码提交到仓库
jdbc.driver=com.mysql.cj.jdbc.Driver
jdbc.url=jdbc:mysql://127.0.0.1:8889/ajou_admin?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=Asia/Shanghai&characterEncoding=UTF-8
jdbc.username=root
jdbc.password=请改为你的数据库密码
